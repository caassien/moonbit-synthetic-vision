name: MoonBit quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup latest stable MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Show toolchain
        run: moon version

      - name: Check formatting
        run: moon fmt --check

      - name: Check warnings
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Run tests with coverage
        run: moon test --target ${{ matrix.target }} --deny-warn --enable-coverage

      - name: Coverage summary
        run: |
          moon coverage report -f summary
          moon coverage analyze

      - name: Generate public interfaces
        if: matrix.target == 'wasm-gc'
        run: moon info --target wasm-gc

      - name: Verify generated files
        if: matrix.target == 'wasm-gc'
        run: git diff --exit-code

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup latest stable MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Run preview
        run: moon run --target wasm-gc cmd/main
      - name: Run benchmark
        run: moon run --target native cmd/bench
